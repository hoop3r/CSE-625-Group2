name: Release LaTeX PDF

on:
  push:
    tags: ['*-v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve assignment folder from the tag
        id: meta
        run: echo "dir=${GITHUB_REF_NAME%%-v*}" >> "$GITHUB_OUTPUT"

      - name: Compile main.tex
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: ${{ steps.meta.outputs.dir }}
          root_file: main.tex

      - name: Name the release asset after the tag
        run: cp "${GITHUB_REF_NAME%%-v*}/main.pdf" "$GITHUB_REF_NAME.pdf"

      - name: Publish PDF to a release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.ref_name }}.pdf
          generate_release_notes: true
